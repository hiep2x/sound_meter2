<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get help and support for Sound Meter, the sound level measurement app for iOS.">
  <title>Sound Meter — Support</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #182337; display: flex; flex-direction: column; }
    main { width: min(100% - 36px, 620px); margin: auto; padding: 64px 0; }
    .card { background: #fff; padding: clamp(28px, 6vw, 48px); border: 1px solid #e5e9f0; border-radius: 22px; box-shadow: 0 12px 40px rgba(32, 52, 86, .06); text-align: center; }
    .icon { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(145deg, #2179eb, #0a459e); color: white; }
    .icon svg { width: 43px; height: 43px; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 36px); letter-spacing: -.7px; }
    .subtitle { color: #617087; font-size: 16px; margin: 10px 0 30px; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    p { line-height: 1.7; }
    .help { color: #4c5b70; margin: 0 0 26px; }
    .button { display: inline-flex; align-items: center; justify-content: center; background: #1767d2; border-radius: 12px; color: #fff; padding: 14px 24px; text-decoration: none; font-weight: 650; }
    .button:hover, .button:focus-visible { background: #0b51ad; }
    .email { display: block; margin-top: 16px; color: #36506e; overflow-wrap: anywhere; }
    footer { text-align: center; color: #8792a3; font-size: 13px; padding: 0 20px 24px; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="app-name">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 30h5l4-13 7 21 6-29 6 21 4-10 3 10h3" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 id="app-name">Sound Meter</h1>
      <p class="subtitle">App Support</p>
      <h2>How can we help?</h2>
      <p class="help">Have a question, found a bug, or want to share feedback about Sound Meter? We're happy to hear from you. Please contact our support team by email.</p>
      <a class="button" href="mailto:voicepitch.team@gmail.com?subject=Sound%20Meter%20Support">Contact Support</a>
      <a class="email" href="mailto:voicepitch.team@gmail.com">voicepitch.team@gmail.com</a>
    </section>
  </main>
  <footer>© 2026 Sound Meter. All rights reserved.</footer>
</body>
</html>
